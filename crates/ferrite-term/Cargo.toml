[package]
name = "ferrite-term"
description = "Ferrite 통합 터미널: PTY(ConPTY·Unix pty)로 셸을 띄우고 터미널 화면 상태를 관리한다"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alacritty_terminal = "0.26.0"

# PTY를 직접 열어 slave를 쥐어 둔다(셸이 끝날 때 마지막 출력을 잃지 않게, `Terminal::spawn` 참고).
[target.'cfg(unix)'.dependencies]
rustix-openpty = "0.2.0"
