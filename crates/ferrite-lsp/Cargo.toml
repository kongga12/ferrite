[package]
name = "ferrite-lsp"
description = "Ferrite LSP 클라이언트: 언어 서버 실행·설치, JSON-RPC 전송, 위치·URI 변환"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
flate2 = "1.1.10"
lsp-types = "0.97"
ropey.workspace = true
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "platform-verifier"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
