name: CI

# 비공개 저장소는 Actions 분을 Windows ×2, macOS ×10으로 센다. 그래서 PR·main 푸시는 Ubuntu로
# 빠르게 검사하고, 3개 OS 전체(릴리스 빌드·실행 파일 포함)는 수동 실행과 주 1회로 돌린다.
# 중요한 PR은 머지 전에 "Run workflow"(브랜치 선택)로 3개 OS를 돌린다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0' # 매주 월요일 03:00 KST

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소한다(쓸모없어진 실행에 분을 쓰지 않게).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 로컬에서 재현되지 않는 OS별 실패를 로그만으로 찾을 수 있게 패닉 위치를 남긴다.
env:
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    # DB 시험: MariaDB·Oracle XE 11g·CUBRID는 서비스 컨테이너로 띄운다(Linux 러너만 된다). PostgreSQL은
    # 러너에 깔린 initdb로 시험이 임시 클러스터를 띄운다. Oracle·CUBRID는 러너의 JDK로 JDBC 사이드카를 돌린다.
    # CUBRID는 상태 검사가 없어 시험이 연결될 때까지 다시 연결한다.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ferrite
          MARIADB_DATABASE: ferrite
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
      oracle:
        image: gvenzl/oracle-xe:11-slim
        env:
          ORACLE_PASSWORD: ferrite
          APP_USER: ferrite
          APP_USER_PASSWORD: ferrite
        ports:
          - 1521:1521
        options: >-
          --health-cmd=healthcheck.sh
          --health-interval=10s --health-timeout=5s --health-retries=30
      cubrid:
        image: cubrid/cubrid:11.2
        env:
          CUBRID_DB: ferrite
          CUBRID_USER: ferrite
          CUBRID_PASSWORD: ferrite
          CUBRID_LOCALE: en_US.utf8
        ports:
          - 33000:33000
    env:
      FERRITE_TEST_MARIADB: 127.0.0.1:3306:root:ferrite:ferrite
      FERRITE_TEST_ORACLE: 127.0.0.1:1521:ferrite:ferrite:XE
      FERRITE_TEST_CUBRID: 127.0.0.1:33000:ferrite:ferrite:ferrite
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-analyzer
          # 예제 WASM 플러그인 시험(examples/plugins)
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Linux 빌드 의존성 설치
        # fonts-nanum: 러너에 한글 폰트가 없어 UI 테스트가 한글 글리프 누락으로 실패하는 것을 막는다.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev fonts-nanum
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: DAP·노트북 시험용 debugpy·ipykernel·pandas 설치
        run: python -m pip install --disable-pip-version-check debugpy==1.8.22 ipykernel==7.4.0 pandas==3.1.0
      # 시험은 [받기]와 같은 판을 로컬 Maven 저장소에서 찾는다(Maven이 저장소의 체크섬을 확인한다).
      # jar만 받는다: ojdbc6 POM의 의존(xdb 등)은 Maven Central에 없다.
      - name: JDBC 시험용 드라이버 받기
        run: |
          mvn -B -q dependency:get -Dtransitive=false -Dartifact=com.oracle.database.jdbc:ojdbc6:11.2.0.4
          mvn -B -q dependency:get -Dtransitive=false -Dartifact=com.oracle.database.nls:orai18n:11.2.0.4
          mvn -B -q dependency:get -Dtransitive=false -Dartifact=cubrid:cubrid-jdbc:11.2.0.0035 \
            -DremoteRepositories=https://maven.cubrid.org
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # 3개 OS 전체 검사: 수동 실행·주 1회만.
  full:
    name: full (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rust-analyzer
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Linux 빌드 의존성 설치
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev fonts-nanum
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: DAP·노트북 시험용 debugpy·ipykernel·pandas 설치
        run: python -m pip install --disable-pip-version-check debugpy==1.8.22 ipykernel==7.4.0 pandas==3.1.0
      # DB 시험의 임시 PostgreSQL 클러스터용. Ubuntu·Windows 러너에는 깔려 있고 macOS에는 없다.
      - name: PostgreSQL 설치(macOS)
        if: runner.os == 'macOS'
        run: brew install postgresql@17
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release
      - name: 실행 파일 업로드 (OS별 수동 검증용)
        uses: actions/upload-artifact@v4
        with:
          name: ferrite-${{ runner.os }}
          path: |
            target/release/ferrite
            target/release/ferrite.exe
          if-no-files-found: error

  coverage:
    name: coverage (ferrite-core ≥ 70%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov -p ferrite-core --fail-under-lines 70 --summary-only
