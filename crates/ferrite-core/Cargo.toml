regex = "1.13.1"
ropey.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
toml = "1.1.8"
trash = "5"
tree-sitter = "0.27.1"
tree-sitter-c = "0.24.2"
