name: 디버그 어댑터 실제 설치

# 디버그 어댑터(debugpy·codelldb·delve·vscode-php-debug·java-debug·vscode-js-debug)를 실제 배포처에서 받아
# Ferrite 설치기로 설치하고, 언어마다 예제의 중단점에서 멈춰 변수를 읽는다(3개 OS). js-debug는 러너의 Chrome을
# 헤드리스로 띄워 외부 스크립트와 화면의 인라인 스크립트에서 멈춘다. 한 번에 약 120MB(jdt.ls 포함)를 받고 Go·PHP·Java를
# 준비하느라 오래 걸리므로, 어댑터 목록·설치·연결 코드를 바꾼 PR에서만 돈다. 그 밖에는 수동 실행
# ("Run workflow")과 매주 한 번(고정한 배포 파일이 사라지거나 바뀌었는지 확인).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/ferrite-dap/**'
      - 'crates/ferrite-lsp/src/catalog.rs'
      - 'crates/ferrite-lsp/src/install.rs'
      - '.github/workflows/adapters.yml'
  schedule:
    - cron: '0 19 * * 0' # 매주 월요일 04:00 KST

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1

jobs:
  adapters:
    name: adapters (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # debugpy는 이 Python으로 가상환경을 만들고, 디버그 대상도 이 Python으로 띄운다.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # delve는 go install로 만들고, 디버그 대상도 Go로 빌드한다.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      # java-debug는 jdt.ls(Java 21 이상)에 실어 띄운다.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # vscode-php-debug는 Xdebug 3과 말한다. node는 러너에 있다.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: xdebug
          coverage: xdebug
      # 헤드리스 Chrome의 화면 프로세스가 가끔 죽는다(Target.targetCrashed, 러너의 자원 탓으로 본다). js-debug는
      # 그것을 DAP로 알리지 않아 시험이 멈춤을 기다리다 시간 초과로 깨진다. 시험은 그때 js-debug 기록을 보고 표시
      # 줄을 찍으므로, 표시가 있을 때만 깨진 시험을 이름으로 한 번 다시 돌린다(다른 까닭으로 깨지면 그대로 실패).
      - name: 어댑터 받아 설치하고 중단점에서 변수 읽기
        shell: bash
        run: |
          set -o pipefail
          tests="cargo test -p ferrite-dap --test adapters -- --ignored --nocapture --test-threads=1"
          $tests 2>&1 | tee adapters.log && exit 0
          if ! grep -q "Target.targetCrashed]" adapters.log; then
            exit 1
          fi
          # libtest가 끝에 내는 failures: 목록(들여 쓴 이름들)에서 깨진 시험을 읽는다.
          failed=$(tr -d '\r' < adapters.log | awk '/^failures:$/{list=1; names=""; next} list && /^    [^ ]/{names=names" "$1; next} list && /^$/{list=0} END{print names}')
          # 이름을 못 읽었으면(요약 전에 끊김 등) 다시 돌릴 것이 없으니 그대로 실패다.
          if [ -z "$failed" ]; then
            exit 1
          fi
          echo "::warning::브라우저 화면 프로세스가 죽어 깨진 시험을 한 번 다시 돌린다: $failed"
          for name in $failed; do
            $tests --exact "$name" || exit 1
          done
