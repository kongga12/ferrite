name: CI

# 비공개 저장소는 Actions 분을 Windows ×2, macOS ×10으로 센다. 그래서 PR·main 푸시는 Ubuntu로
# 빠르게 검사하고, 3개 OS 전체(릴리스 빌드·실행 파일 포함)는 수동 실행과 주 1회로 돌린다.
# 중요한 PR은 머지 전에 "Run workflow"(브랜치 선택)로 3개 OS를 돌린다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0' # 매주 월요일 03:00 KST

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소한다(쓸모없어진 실행에 분을 쓰지 않게).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 로컬에서 재현되지 않는 OS별 실패를 로그만으로 찾을 수 있게 패닉 위치를 남긴다.
env:
  RUST_BACKTRACE: 1
  # 시험 빌드의 디버그 정보를 줄 번호만 남긴다(패닉 위치는 그대로 보인다). Rust 캐시가 작업마다 1.1~1.6GB여서
  # 저장소 캐시 한도(10GB)를 거의 채웠다(2026-11-20).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Maven Central에서 받다가 러너의 네트워크가 잠깐 끊기면 Maven·Gradle 시험이 한꺼번에 깨졌다(2026-11-18,
  # full ubuntu의 "Could not transfer artifact"). 모든 mvn(시험이 띄우는 것 포함, Maven 3.9 이상)이 읽는
  # MAVEN_ARGS로 받기를 더 여러 번 다시 한다. 이름은 resolver 판마다 다르다(1.x connector, 2.x transport).
  # 모르는 이름은 Maven이 무시한다.
  MAVEN_ARGS: >-
    -Daether.connector.http.retryHandler.count=6
    -Daether.transport.http.retryHandler.count=6

jobs:
  linux:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    # DB 시험: MariaDB·Oracle XE 11g·CUBRID는 서비스 컨테이너로 띄운다(Linux 러너만 된다). PostgreSQL은
    # 러너에 깔린 initdb로 시험이 임시 클러스터를 띄운다. Oracle·CUBRID는 러너의 JDK로 JDBC 사이드카를 돌린다.
    # CUBRID는 상태 검사가 없어 시험이 연결될 때까지 다시 연결한다.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ferrite
          MARIADB_DATABASE: ferrite
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
      oracle:
        image: gvenzl/oracle-xe:11-slim
        env:
          ORACLE_PASSWORD: ferrite
          APP_USER: ferrite
          APP_USER_PASSWORD: ferrite
        ports:
          - 1521:1521
        options: >-
          --health-cmd=healthcheck.sh
          --health-interval=10s --health-timeout=5s --health-retries=30
      cubrid:
        image: cubrid/cubrid:11.2
        env:
          CUBRID_DB: ferrite
          CUBRID_USER: ferrite
          CUBRID_PASSWORD: ferrite
          CUBRID_LOCALE: en_US.utf8
        ports:
          - 33000:33000
    env:
      FERRITE_TEST_MARIADB: 127.0.0.1:3306:root:ferrite:ferrite
      FERRITE_TEST_ORACLE: 127.0.0.1:1521:ferrite:ferrite:XE
      FERRITE_TEST_CUBRID: 127.0.0.1:33000:ferrite:ferrite:ferrite
    steps:
      # 러너마다 디스크 크기가 달라, 작은 러너(빈 곳 약 13GB)에서는 이 작업(target 약 9~11GB, 컨테이너)과
      # full 작업(릴리스 빌드까지 약 13GB, 캐시 저장 1.7GB)이 "No space left on device"로 죽었다.
      # 이 저장소가 쓰지 않는 .NET·Android SDK·GHC·Swift·CodeQL(약 26GB)과 쓰지 않는 Docker 이미지(약 2.5GB)를 지운다.
      # Java·Go·Node·Python·Maven·PostgreSQL과 서비스 컨테이너가 쓰는 이미지는 시험이 쓰므로 둔다.
      - &free-disk
        name: 쓰지 않는 러너 도구 지우기(디스크 확보)
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          docker image prune -af | tail -1
          df -h /
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-analyzer
          # 예제 WASM 플러그인 시험(examples/plugins)
          targets: wasm32-unknown-unknown
      # 기본 가지(main)의 실행만 저장하고 다른 가지는 main의 것을 읽는다. 가지마다 저장하면 의존성을 바꾼
      # PR 하나로 작업마다 1GB 넘게 쌓였다.
      - &rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux 빌드 의존성 설치
        # fonts-nanum: 러너에 한글 폰트가 없어 UI 테스트가 한글 글리프 누락으로 실패하는 것을 막는다.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev fonts-nanum
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: DAP·노트북 시험용 debugpy·ipykernel·pandas 설치
        run: python -m pip install --disable-pip-version-check debugpy==1.8.22 ipykernel==7.4.0 pandas==3.1.0
      # 시험은 [받기]와 같은 판을 로컬 Maven 저장소에서 찾는다(Maven이 저장소의 체크섬을 확인한다).
      # jar만 받는다: ojdbc6 POM의 의존(xdb 등)은 Maven Central에 없다.
      # maven.cubrid.org가 가끔 응답하지 않는다(2026-11-19 "Connect to maven.cubrid.org:443 … Read timed out"으로
      # 이 작업이 깨졌다). 받은 드라이버를 판으로 캐시해 두고, 캐시가 없을 때만 받되 몇 번 기다렸다 다시 해 본다.
      - name: JDBC 시험용 드라이버 캐시
        id: jdbc-drivers
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository/com/oracle/database/jdbc/ojdbc6/11.2.0.4
            ~/.m2/repository/com/oracle/database/nls/orai18n/11.2.0.4
            ~/.m2/repository/cubrid/cubrid-jdbc/11.2.0.0035
          key: jdbc-drivers-ojdbc6-11.2.0.4-orai18n-11.2.0.4-cubrid-11.2.0.0035
      - name: JDBC 시험용 드라이버 받기
        if: steps.jdbc-drivers.outputs.cache-hit != 'true'
        run: |
          get() {
            for try in 1 2 3; do
              mvn -B -q dependency:get -Dtransitive=false "$@" && return 0
              echo "::warning::드라이버 받기 실패($try/3): $*"
              [ "$try" = 3 ] || sleep 30
            done
            return 1
          }
          get -Dartifact=com.oracle.database.jdbc:ojdbc6:11.2.0.4
          get -Dartifact=com.oracle.database.nls:orai18n:11.2.0.4
          get -Dartifact=cubrid:cubrid-jdbc:11.2.0.0035 -DremoteRepositories=https://maven.cubrid.org
      # JDBC 사이드카를 JDK 8로도 컴파일하는 시험은 JDK 8을 `JAVA_HOME_8_X64`에서 찾는다. ubuntu-latest가
      # ubuntu-26.04 이미지로 바뀌며 JDK 8이 빠졌다(2026-11-16). 없을 때만 Temurin 8을 받아 그 변수만 알린다
      # (`JAVA_HOME`·`PATH`는 그대로 두어 다른 시험의 Java를 바꾸지 않는다).
      # 받는 파일(GitHub 릴리스)이 CI에서 압축 파일 대신 저장소의 XML 목록(`<BlockList>`)을 줄 때가 있다
      # (2026-11-20, 30초씩 세 번 다시 해도 같았다). 판을 고정해 푼 것을 캐시하고 캐시가 없을 때만 받는다.
      - &jdk8-cache
        name: JDK 8 캐시(러너에 없으면)
        id: jdk8
        if: runner.os == 'Linux' && env.JAVA_HOME_8_X64 == ''
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/jdk8
          key: jdk8-temurin-8u514b01-linux-x64
      - &jdk8
        name: JDK 8 받기(러너에 없으면)
        if: runner.os == 'Linux' && env.JAVA_HOME_8_X64 == ''
        # 받은 것이 압축 파일이 아니면 앞부분을 경고로 남기고 기다렸다 세 번까지 다시 한다.
        run: |
          archive="$RUNNER_TEMP/jdk8.tar.gz"
          for try in 1 2 3; do
            [ "${{ steps.jdk8.outputs.cache-hit }}" = true ] && break
            rm -rf "$RUNNER_TEMP/jdk8" && mkdir -p "$RUNNER_TEMP/jdk8"
            if curl -fsSL -o "$archive" https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u514-b01/OpenJDK8U-jdk_x64_linux_hotspot_8u514b01.tar.gz \
              && tar -xzf "$archive" -C "$RUNNER_TEMP/jdk8" --strip-components=1; then
              break
            fi
            echo "::warning::JDK 8 받기 실패($try/3): $(head -c 120 "$archive" 2>/dev/null | tr -cd '[:print:]')"
            [ "$try" = 3 ] && exit 1
            sleep 30
          done
          rm -f "$archive"
          "$RUNNER_TEMP/jdk8/bin/javac" -version
          echo "JAVA_HOME_8_X64=$RUNNER_TEMP/jdk8" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # 다음에 디스크가 모자라면 어디까지 찼는지 보이게 한다(뒤의 캐시 저장도 이 빈 곳을 쓴다).
      - &disk-left
        name: 남은 디스크
        if: always() && runner.os == 'Linux'
        run: df -h /

  # 3개 OS 전체 검사: 수동 실행·주 1회만.
  full:
    name: full (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - *free-disk
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rust-analyzer
          targets: wasm32-unknown-unknown
      - *rust-cache
      - name: Linux 빌드 의존성 설치
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev fonts-nanum
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: DAP·노트북·테스트 러너·정적 분석 시험용 debugpy·ipykernel·pandas·pytest·semgrep 설치
        run: python -m pip install --disable-pip-version-check debugpy==1.8.22 ipykernel==7.4.0 pandas==3.1.0 pytest==8.4.2 semgrep==1.183.0
      # DB 시험의 임시 PostgreSQL 클러스터용. Ubuntu·Windows 러너에는 깔려 있고 macOS에는 없다.
      - name: PostgreSQL 설치(macOS)
        if: runner.os == 'macOS'
        run: brew install postgresql@17
      - *jdk8-cache
      - *jdk8
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # npm으로 설치하는 웹 언어 서버: TypeScript 7 실행 파일과 Node로 도는 HTML·CSS·JSON 서버가 3개 OS에서
      # 뜨고 진단을 주는지 본다(내려받기 시험은 기본으로 돌지 않아 따로 부른다).
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: 웹 언어 서버 설치 시험(npm)
        run: cargo test -p ferrite-lsp --test download npm -- --ignored --nocapture
      # 테스트 러너: 실제 Maven(JUnit 5)·Gradle·pytest·Go·CTest를 돌려 보고서를 읽고 실패만 다시 돌린다.
      # SpotBugs·PMD·Semgrep의 SARIF와 Maven·Gradle이 푼 의존성 나무(취약점 검사)도 읽는다.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      # 시험이 받는 Maven·Gradle 의존성을 캐시한다. Maven Central이 잠깐 답하지 않거나 "찾을 수 없음"으로 답해
      # Maven·Gradle 시험이 한꺼번에 깨졌다(2026-11-19 #121, 2026-11-20 #127, 받기 재시도로도 막지 못함).
      # 판은 시험 파일에 적혀 있어 그 파일로 키를 만든다. 바뀌면 앞 캐시에서 이어 받는다.
      - name: Maven 의존성 캐시
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: full-m2-${{ runner.os }}-${{ hashFiles('crates/ferrite-core/tests/test_tools.rs') }}
          restore-keys: full-m2-${{ runner.os }}-
      # 로컬에서 확인한 판에 맞춘다. Gradle 홈의 캐시는 setup-gradle이 맡는다(기본 가지 main의 실행만 저장하고
      # 다른 가지는 읽기만 한다).
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.0'
          add-job-summary: never
      # Gradle도 받기가 잠깐 끊겨도 더 여러 번, 더 길게 기다리며 다시 한다(기본 3번, 125ms부터).
      # 사용자 홈의 gradle.properties는 시험이 만드는 모든 빌드가 읽는다(Gradle 홈을 따로 준 시험은 빼고).
      - name: Gradle 받기 재시도 설정
        shell: bash
        run: |
          mkdir -p ~/.gradle
          printf '%s\n' \
            'systemProp.org.gradle.internal.repository.max.retries=6' \
            'systemProp.org.gradle.internal.repository.initial.backoff=2000' >> ~/.gradle/gradle.properties
          cat ~/.gradle/gradle.properties
      - name: 테스트 러너·정적 분석 시험(Maven·Gradle·pytest·Go·CTest·SpotBugs·PMD·Semgrep)
        run: cargo test -p ferrite-core --test test_tools -- --ignored --nocapture --test-threads=1
      - run: cargo build --release
      - name: 실행 파일 업로드 (OS별 수동 검증용)
        uses: actions/upload-artifact@v4
        with:
          name: ferrite-${{ runner.os }}
          path: |
            target/release/ferrite
            target/release/ferrite.exe
          if-no-files-found: error
      - *disk-left

  coverage:
    name: coverage (ferrite-core ≥ 70%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - *rust-cache
      - run: cargo llvm-cov -p ferrite-core --fail-under-lines 70 --summary-only
