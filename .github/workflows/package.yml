name: Package

# 설치 파일을 만든다(cargo-packager). 수동 실행, 패키징 설정을 바꾼 PR, `v*` 태그에서 돈다. 설정은
# crates/ferrite-app/Cargo.toml의 [package.metadata.packager]에 있다. OS 코드 서명은 하지 않는다.
#   Windows: NSIS(사용자별 설치, 관리자 권한 없음)·MSI(WiX)
#   macOS: .app·.dmg(러너 아키텍처, 지금은 arm64)
#   Linux: .deb·AppImage
# `v*` 태그에서는 설치 파일마다 업데이트 서명(.sig, 비밀 값 FERRITE_UPDATER_KEY·_PASSWORD)을 만들고,
# GitHub 릴리스를 만들어 설치 파일과 latest.json(앱의 자동 업데이트가 읽는다)을 올린다.
# 그 밖에는 아티팩트로만 올린다.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/package.yml
      - .github/scripts/latest_json.py
      - crates/ferrite-app/Cargo.toml
      - crates/ferrite-app/icons/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_PACKAGER_VERSION: 0.11.8

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: nsis,wix
            files: |
              target/packages/*.exe
              target/packages/*.msi
          - os: macos-latest
            formats: app,dmg
            files: |
              target/packages/*.dmg
              target/packages/*.app.tar.gz
          - os: ubuntu-latest
            formats: deb,appimage
            files: |
              target/packages/*.deb
              target/packages/*.AppImage
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux 빌드 의존성 설치
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      # 판을 고정한다. rust-cache가 ~/.cargo/bin을 남기므로 다음 실행에서는 다시 빌드하지 않는다.
      - name: cargo-packager 설치
        run: cargo install cargo-packager --locked --version ${{ env.CARGO_PACKAGER_VERSION }}
      # cargo-packager는 설정 파일 폴더로 옮겨 가 돌므로 경로는 절대 경로로 준다. NSIS·WiX·linuxdeploy는
      # cargo-packager가 받아 쓴다(고정한 판과 해시는 cargo-packager 소스에 있다).
      - name: 설치 파일 만들기
        shell: bash
        env:
          # 러너에 FUSE가 없어 linuxdeploy(AppImage)를 풀어서 돌린다.
          APPIMAGE_EXTRACT_AND_RUN: 1
          UPDATER_KEY: ${{ secrets.FERRITE_UPDATER_KEY }}
          UPDATER_KEY_PASSWORD: ${{ secrets.FERRITE_UPDATER_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ -z "$UPDATER_KEY" ]; then
              echo "::error::릴리스에는 업데이트 서명 키(비밀 값 FERRITE_UPDATER_KEY)가 필요합니다"
              exit 1
            fi
            # cargo-packager가 읽는 환경 변수. 설치 파일마다 .sig를 만든다. 키는 base64 한 줄이므로
            # 비밀 값을 넣을 때 붙은 줄바꿈을 지운다.
            export CARGO_PACKAGER_SIGN_PRIVATE_KEY="$(printf %s "$UPDATER_KEY" | tr -d '\r\n')"
            export CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD="$UPDATER_KEY_PASSWORD"
          fi
          cargo packager --release -p ferrite-app --formats ${{ matrix.formats }} \
            --out-dir "$GITHUB_WORKSPACE/target/packages" \
            --binaries-dir "$GITHUB_WORKSPACE/target/release"
      # 만든 설치 파일을 그 자리에서 설치 → 실행(`--version`) → 제거하고, 남은 것이 없는지 본다. 창을 띄우는
      # 것은 보지 못한다(러너에 화면이 없다).
      - name: 설치 시험(Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "$env:GITHUB_WORKSPACE\target\packages"
          function Check-Version($exe) {
            $log = "$env:RUNNER_TEMP\version.txt"
            $p = Start-Process $exe -ArgumentList '--version' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $log
            $v = (Get-Content $log -Raw).Trim()
            if ($p.ExitCode -ne 0 -or $v -notmatch '^ferrite \d+\.\d+\.\d+$') { throw "실행 실패: $exe → '$v' (종료 $($p.ExitCode))" }
            "실행: $v"
          }
          function Uninstall-Entries($root) {
            Get-ChildItem "$root\Software\Microsoft\Windows\CurrentVersion\Uninstall" -ErrorAction SilentlyContinue |
              Get-ItemProperty | Where-Object DisplayName -eq 'Ferrite'
          }

          # NSIS: 사용자별 설치(%LOCALAPPDATA%\Ferrite)
          $setup = (Get-ChildItem $out -Filter '*-setup.exe')[0].FullName
          $p = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "NSIS 설치 실패: $($p.ExitCode)" }
          $dir = "$env:LOCALAPPDATA\Ferrite"
          Check-Version "$dir\ferrite.exe"
          if (-not (Uninstall-Entries 'HKCU:')) { throw 'NSIS: 프로그램 추가/제거 항목이 없다' }
          # 제거 프로그램은 임시 폴더에 자신을 복사해 돌고 바로 끝나므로 파일이 없어질 때까지 기다린다.
          Start-Process "$dir\uninstall.exe" -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $dir); $i++) { Start-Sleep 1 }
          $left = @()
          if (Test-Path $dir) { $left += Get-ChildItem $dir -Recurse | ForEach-Object FullName }
          if (Test-Path 'HKCU:\Software\Cheolho Choo') { $left += 'HKCU:\Software\Cheolho Choo' }
          if (Uninstall-Entries 'HKCU:') { $left += '프로그램 추가/제거 항목' }
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Ferrite.lnk"
          if (Test-Path $lnk) { $left += $lnk }
          if ($left) { throw "NSIS 제거 뒤 남은 것: $($left -join ', ')" }
          'NSIS: 설치·실행·제거 통과'

          # MSI: 시스템 전체 설치(러너는 관리자)
          $msi = (Get-ChildItem $out -Filter '*.msi')[0].FullName
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v `"$env:RUNNER_TEMP\msi-install.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\msi-install.log" -Tail 40; throw "MSI 설치 실패: $($p.ExitCode)" }
          $exe = (Get-ChildItem $env:ProgramFiles, ${env:ProgramFiles(x86)} -Filter ferrite.exe -Recurse -Depth 2 -ErrorAction SilentlyContinue)[0].FullName
          if (-not $exe) { throw 'MSI: 설치한 ferrite.exe를 찾지 못했다' }
          Check-Version $exe
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI 제거 실패: $($p.ExitCode)" }
          $left = @()
          if (Test-Path (Split-Path $exe)) { $left += Split-Path $exe }
          if (Uninstall-Entries 'HKLM:') { $left += '프로그램 추가/제거 항목' }
          if ($left) { throw "MSI 제거 뒤 남은 것: $($left -join ', ')" }
          'MSI: 설치·실행·제거 통과'
      - name: 설치 시험(macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          check() {
            v=$("$1" --version)
            echo "실행: $v"
            [[ "$v" =~ ^ferrite\ [0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::실행 실패: $1 → $v"; exit 1; }
          }
          # dmg: 열어 .app을 복사해 실행하고 지운다(dmg는 그 밖에 설치하는 것이 없다).
          mnt=$(mktemp -d); dest=$(mktemp -d)
          hdiutil attach target/packages/*.dmg -nobrowse -readonly -mountpoint "$mnt"
          cp -R "$mnt"/*.app "$dest/"
          hdiutil detach "$mnt"
          check "$dest"/*.app/Contents/MacOS/ferrite
          rm -rf "$dest"
          echo 'dmg: 실행 통과'
          # 업데이트로 받는 .app.tar.gz(서명하는 `v*` 태그에서만 만든다)
          if compgen -G 'target/packages/*.app.tar.gz' > /dev/null; then
            tgz=$(mktemp -d)
            tar -xzf target/packages/*.app.tar.gz -C "$tgz"
            check "$tgz"/*.app/Contents/MacOS/ferrite
            rm -rf "$tgz"
            echo 'app.tar.gz: 실행 통과'
          fi
      - name: 설치 시험(Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          set -euo pipefail
          check() {
            v=$("$@" --version)
            echo "실행: $v"
            [[ "$v" =~ ^ferrite\ [0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::실행 실패: $* → $v"; exit 1; }
          }
          # deb: apt로 설치해 적은 의존이 풀리는지도 본다.
          deb=$(ls "$GITHUB_WORKSPACE"/target/packages/*.deb)
          pkg=$(dpkg-deb -f "$deb" Package)
          sudo apt-get install -y "$deb"
          check ferrite
          dpkg -L "$pkg" > "$RUNNER_TEMP/files.txt"
          sudo apt-get purge -y "$pkg"
          left=$(while read -r f; do [ -f "$f" ] && echo "$f" || true; done < "$RUNNER_TEMP/files.txt")
          [ -z "$left" ] || { echo "::error::deb 제거 뒤 남은 파일: $left"; exit 1; }
          echo 'deb: 설치·실행·제거 통과'
          appimage=$(ls "$GITHUB_WORKSPACE"/target/packages/*.AppImage)
          chmod +x "$appimage"
          check "$appimage"
          echo 'AppImage: 실행 통과'
      - uses: actions/upload-artifact@v4
        with:
          name: ferrite-packages-${{ runner.os }}
          path: |
            ${{ matrix.files }}
            target/packages/*.sig
          if-no-files-found: error

  release:
    name: release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 태그와 앱 판이 같은지 확인
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "ferrite-app") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그($GITHUB_REF_NAME)와 앱 판(v$version)이 다릅니다"
            exit 1
          fi
      - name: latest.json 만들기
        run: python3 .github/scripts/latest_json.py dist "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > dist/latest.json
      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Ferrite ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
