[package]
name = "ferrite-update"
description = "Ferrite 자동 업데이트: 릴리스 매니페스트 확인, 설치 파일 서명(minisign) 검증, 설치"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22.1"
minisign-verify = "0.3.0"
serde_json = "1.0.154"
# 언어 서버 받기(ferrite-lsp)와 같은 설정: OS 인증서 저장소로 TLS를 검증한다.
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "platform-verifier"] }
