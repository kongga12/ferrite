name: CI

# 비공개 저장소는 Actions 분을 Windows ×2, macOS ×10으로 센다. 그래서 PR·main 푸시는 Ubuntu로
# 빠르게 검사하고, 3개 OS 전체(릴리스 빌드·실행 파일 포함)는 수동 실행과 주 1회로 돌린다.
# 중요한 PR은 머지 전에 "Run workflow"(브랜치 선택)로 3개 OS를 돌린다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0' # 매주 월요일 03:00 KST

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소한다(쓸모없어진 실행에 분을 쓰지 않게).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-analyzer
      - uses: Swatinem/rust-cache@v2
      - name: Linux 빌드 의존성 설치
        # fonts-nanum: 러너에 한글 폰트가 없어 UI 테스트가 한글 글리프 누락으로 실패하는 것을 막는다.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev fonts-nanum
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # 3개 OS 전체 검사: 수동 실행·주 1회만.
  full:
    name: full (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rust-analyzer
      - uses: Swatinem/rust-cache@v2
      - name: Linux 빌드 의존성 설치
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev fonts-nanum
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release
      - name: 실행 파일 업로드 (OS별 수동 검증용)
        uses: actions/upload-artifact@v4
        with:
          name: ferrite-${{ runner.os }}
          path: |
            target/release/ferrite
            target/release/ferrite.exe
          if-no-files-found: error

  coverage:
    name: coverage (ferrite-core ≥ 70%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov -p ferrite-core --fail-under-lines 70 --summary-only
