name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux 빌드 의존성 설치
        if: runner.os == 'Linux'
        # fonts-nanum: 러너에 한글 폰트가 없어 UI 테스트가 한글 글리프 누락으로 실패하는 것을 막는다.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev fonts-nanum
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release
      - name: 실행 파일 업로드 (OS별 수동 검증용)
        uses: actions/upload-artifact@v4
        with:
          name: ferrite-${{ runner.os }}
          path: |
            target/release/ferrite
            target/release/ferrite.exe
          if-no-files-found: error

  coverage:
    name: coverage (ferrite-core ≥ 70%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov -p ferrite-core --fail-under-lines 70 --summary-only
