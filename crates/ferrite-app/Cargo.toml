[package]
name = "ferrite-app"
description = "Rust 기반 크로스플랫폼 경량 IDE"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ferrite"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
dirs = "7.0.0"
eframe.workspace = true
egui_tiles = "0.18"
ferrite-codegen.workspace = true
ferrite-core.workspace = true
ferrite-dap.workspace = true
ferrite-db.workspace = true
ferrite-egov.workspace = true
ferrite-lsp.workspace = true
ferrite-notebook.workspace = true
ferrite-term.workspace = true
ferrite-update.workspace = true
# 노트북 그림 출력(PNG). eframe이 이미 쓰는 판이다.
image = { version = "0.25.10", default-features = false, features = ["png"] }
ropey.workspace = true
lsp-types = "0.97"
notify = "8"
rfd.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
egui_kittest.workspace = true
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
encoding_rs.workspace = true

# 설치 파일(cargo-packager 0.11). 패키징 워크플로(.github/workflows/package.yml)가 OS마다
# `cargo packager --release -p ferrite-app --formats ...`로 만든다. 서명은 하지 않는다(Phase 7 문서).
# 설명은 영어로 둔다: WiX(MSI)의 기본 코드 페이지(1252)가 한글을 받지 못한다.
[package.metadata.packager]
product-name = "Ferrite"
identifier = "io.github.kongga12.ferrite"
description = "Lightweight cross-platform IDE for eGovFrame development"
publisher = "Cheolho Choo"
homepage = "https://github.com/kongga12/ferrite"
category = "DeveloperTool"
before-packaging-command = "cargo build --release -p ferrite-app"
icons = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/512x512.png", "icons/icon.ico"]

# 관리자 권한 없이 사용자별로 설치한다(기본값). 설치 화면은 OS 언어, 없으면 한국어.
[package.metadata.packager.nsis]
installer-icon = "icons/icon.ico"
languages = ["Korean", "English"]

[package.metadata.packager.macos]
minimum-system-version = "11.0"

# 그래픽(wgpu)·키보드(xkbcommon)·파일 대화상자(xdg-portal)는 실행 중에 라이브러리를 불러오므로
# 링크로는 드러나지 않는다. 한글 표시에는 한글 글꼴이 필요하다.
[package.metadata.packager.deb]
depends = ["libxkbcommon0", "libxkbcommon-x11-0", "libvulkan1 | libegl1", "fonts-nanum | fonts-noto-cjk"]
